<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura — Meteora pools</title>
<meta name="description" content="Aura is a liquidity agent on Meteora that follows your rules, previews every move and explains every decision.">
<meta property="og:title" content="Aura · Liquidity agent on Meteora">
<meta property="og:description" content="You set the rules. It radiates.">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@Auraonchainai">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:#08707C}a:hover{color:#05505A}
@keyframes auraShine{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.08) rotate(12deg)}}
@keyframes auraPing{0%{box-shadow:0 0 0 0 rgba(18,174,188,.6)}100%{box-shadow:0 0 0 8px rgba(18,174,188,0)}}
@media (prefers-reduced-motion: reduce){.aura-logo svg,.aura-motion{animation:none !important}}
.aura-btn{transition:transform .25s ease, box-shadow .25s ease}
.aura-btn:hover{transform:translateY(-1px)}
.aura-row:hover{background:#F2FAFB}
.aura-nav:hover{background:#F1F8F9}
input:focus,select:focus{outline:2px solid #12AEBC;outline-offset:1px}
</style>
<style>html{scroll-behavior:smooth}#app{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { html, render, h, Component as PreactComponent } from 'https://esm.sh/htm@3.1.1/preact/standalone';

// Small base class: each page's logic exposes renderVals(), the template reads from it.
class DCLogic extends PreactComponent {
  render() { const v = this.renderVals(); return TEMPLATE(v); }
}

const TEMPLATE = (v) => html`

<div style="background: #F6F4EF; color: #1C1B22; font-family: 'Manrope', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 248px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E3EEF0; box-sizing: border-box; padding: 28px 18px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 10px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #04282E">
<span class="aura-logo" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 6px rgba(18,174,188,0.55))"><svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" style="display: block; animation: auraShine 5s ease-in-out infinite"><defs><linearGradient id="auraPoolsGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" /><stop offset="0.45" stop-color="#C9F3F7" /><stop offset="1" stop-color="#12AEBC" /></linearGradient></defs><path d="M12 0C12.6 7.2 16.8 11.4 24 12C16.8 12.6 12.6 16.8 12 24C11.4 16.8 7.2 12.6 0 12C7.2 11.4 11.4 7.2 12 0Z" fill="url(#auraPoolsGrad)" stroke="#12AEBC" stroke-width="0.6" /><path d="M12 7.5C12.25 10.4 13.6 11.75 16.5 12C13.6 12.25 12.25 13.6 12 16.5C11.75 13.6 10.4 12.25 7.5 12C10.4 11.75 11.75 10.4 12 7.5Z" fill="#FFFFFF" /></svg></span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1">Aura</span>
</a>
<div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #6B6975">LIQUIDITY AGENT · METEORA</div>
</div>
<nav aria-label="App" style="display: flex; flex-direction: column; gap: 4px">
<a href="app.html" class="aura-nav" style="text-decoration: none; color: #3A3842; font-size: 15px; padding: 0 14px; min-height: 46px; border-radius: 12px; display: flex; align-items: center">Overview</a>
<a href="app.html" class="aura-nav" style="text-decoration: none; color: #3A3842; font-size: 15px; padding: 0 14px; min-height: 46px; border-radius: 12px; display: flex; align-items: center">My rules</a>
<a href="pools.html" aria-current="page" style="text-decoration: none; color: #04282E; font-weight: 700; font-size: 15px; padding: 0 14px; min-height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; background: #E3F6F8">Meteora pools<svg width="14" height="14" viewBox="0 0 24 24" fill="#12AEBC" aria-hidden="true"><path d="M12 0C12.6 7.2 16.8 11.4 24 12C16.8 12.6 12.6 16.8 12 24C11.4 16.8 7.2 12.6 0 12C7.2 11.4 11.4 7.2 12 0Z" /></svg></a>
<a href="app.html" class="aura-nav" style="text-decoration: none; color: #3A3842; font-size: 15px; padding: 0 14px; min-height: 46px; border-radius: 12px; display: flex; align-items: center">Previews</a>
<a href="app.html" class="aura-nav" style="text-decoration: none; color: #3A3842; font-size: 15px; padding: 0 14px; min-height: 46px; border-radius: 12px; display: flex; align-items: center">Reason log</a>
</nav>
<div style="margin-top: auto; border-top: 1px solid #E3EEF0; padding: 22px 10px 0; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; color: #08707C; background: #E3F6F8; padding: 6px 12px; border-radius: 999px">● Preview mode</span>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #55535E">Browsing pools never moves funds. Every real action is previewed and signed in your own wallet.</p>
<a href="index.html" style="font-size: 14px; font-weight: 700; color: #04282E; text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; gap: 6px">Back to site<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9" /></svg></a>
</div>
</aside>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 40px; border-bottom: 1px solid #E3EEF0; background: #F6F4EF">
<div style="font-size: 13px; color: #6B6975">Aura / <span style="color: #04282E">Meteora pools</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" class="aura-btn" onClick=${v.copyContract} style="font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: #04282E; background: #FFFFFF; border: 1px solid #C9DDE0; border-radius: 999px; padding: 0 18px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">${v.contractLabel}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg></button>
<button type="button" class="aura-btn" onClick=${v.walletAction} style=${`font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: #04282E; background: ${v.accent}; border: none; border-radius: 999px; padding: 0 20px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 20px -10px rgba(18,174,188,0.8)`}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3" /><path d="M16 12.5h2" /><path d="M3 9h15" /></svg>${v.walletLabel}</button>
</div>
</div>

${v.walletHasMsg ? html`<div role="status" style="margin: 16px 40px 0; padding: 12px 16px; border-radius: 14px; background: #04282E; color: #FFFFFF; font-size: 14px; display: flex; gap: 12px; align-items: center"><span>${v.walletMsg}</span><button type="button" onClick=${v.dismissWallet} style="margin-left: auto; background: transparent; border: none; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 32px">Dismiss</button></div>` : null}
<div style="width: 100%; max-width: 1180px; margin: 0 auto; box-sizing: border-box; padding: 64px 40px 96px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #08707C">METEORA DLMM · BROWSE</div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(48px, 6vw, 84px); line-height: 1">Where your liquidity <em style="font-style: italic; color: #08707C">lands.</em></h1>
<p style="margin: 0; max-width: 620px; font-size: 17px; line-height: 1.65; color: #55535E">Look through Meteora's DLMM pools, compare depth and activity, then add the ones you trust to your rule set. Aura only ever works in pools you've approved.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
<label style="flex: 1 1 360px; min-width: 0; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #C9DDE0; border-radius: 16px; padding: 6px 6px 6px 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6975" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search pools</span>
<input type="search" value=${v.query} onInput=${v.onQuery} placeholder="Search by pair or address" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: 'Manrope', sans-serif; font-size: 15px; color: #1C1B22; min-height: 40px" />
<button type="button" class="aura-btn" style="font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #04282E; border: none; border-radius: 12px; padding: 0 20px; min-height: 44px; cursor: pointer">Search</button>
</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #55535E">Token
<select onChange=${v.onQuote} style="font-family: 'Manrope', sans-serif; font-size: 14px; color: #1C1B22; background: #FFFFFF; border: 1px solid #C9DDE0; border-radius: 14px; padding: 0 14px; min-height: 54px; min-width: 140px">
<option value="all">All pairs</option>
<option value="SOL">SOL</option>
<option value="USDC">USDC</option>
<option value="USDT">USDT</option>
<option value="JUP">JUP</option>
</select>
</label>
<button type="button" class="aura-btn" style="font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: #04282E; background: #FFFFFF; border: 1px solid #C9DDE0; border-radius: 14px; padding: 0 18px; min-height: 54px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg>Refresh</button>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 13px; color: #55535E">
<span style="display: inline-flex; align-items: center; gap: 8px"><span class="aura-motion" style="width: 8px; height: 8px; border-radius: 50%; background: #12AEBC; animation: auraPing 1.8s ease-out infinite"></span>Live Meteora DLMM · Updated ${v.clock}</span>
<span>Page 1 · 133,659 pools indexed</span>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCEBEE; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 60px -45px rgba(4,40,46,0.45)">
<div style="overflow-x: auto">
<div style="min-width: 760px">
<div style=${`display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(4, minmax(120px, 1fr)); gap: 16px; padding: 18px 28px; background: ${v.accent}; color: #04282E; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em`}>
<span>POOL</span><span>LIQUIDITY</span><span>24H VOLUME</span><span>24H FEES</span><span>BIN STEP</span>
</div>
${(v.rows || []).map((r, $index) => html`
<div class="aura-row" style="display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(4, minmax(120px, 1fr)); gap: 16px; padding: 22px 28px; border-top: 1px solid #E3EEF0; align-items: center; font-size: 15px">
<div style="display: flex; align-items: center; gap: 14px; min-width: 0">
<span style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; background: #E3F6F8; color: #08707C; display: inline-flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700">${r.initial}</span>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><strong style="font-size: 15px">${r.pair}</strong><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #6B6975">${r.addr}</span></div>
</div>
<span>${r.liquidity}</span>
<span>${r.volume}</span>
<span style="color: #08707C; font-weight: 700">${r.fees}</span>
<span><span style="font-family: 'Space Mono', monospace; font-size: 13px; background: #F1F8F9; padding: 5px 10px; border-radius: 8px">${r.bin}</span></span>
</div>
`)}
${v.empty ? html`
<div style="padding: 48px 28px; border-top: 1px solid #E3EEF0; text-align: center; color: #55535E">No pools match that search.</div>
` : null}
</div>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #6B6975">Pool figures shown are a sample until the live Meteora feed is connected. Listing a pool here isn't a recommendation. Providing liquidity carries risk, including impermanent loss.</p>
</div>
</main>
</div>
`;

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { clock: new Date().toLocaleTimeString('en-US'), query: '', quote: 'all', copied: false, wallet: { status: 'idle', address: '', msg: '' } };
}
componentDidMount() { this._tick = setInterval(() => this.setState({ clock: new Date().toLocaleTimeString('en-US') }), 1000); }
componentWillUnmount() { clearInterval(this._tick); }
provider() {
try { return (window.phantom && window.phantom.solana) || window.solflare || window.solana || null; } catch (e) { return null; }
}
async walletToggle() {
const p = this.provider();
if (this.state.wallet.status === 'connected') { try { if (p && p.disconnect) await p.disconnect(); } catch (e) {} this.setState({ wallet: { status: 'idle', address: '', msg: 'Wallet disconnected.' } }); return; }
if (!p) { this.setState({ wallet: { status: 'idle', address: '', msg: 'No Solana wallet was found in this browser. Install Phantom or Solflare, and once Aura is on its own domain this button connects it.' } }); return; }
this.setState({ wallet: { status: 'connecting', address: '', msg: '' } });
try { const res = await p.connect(); const key = (res && res.publicKey) || p.publicKey; this.setState({ wallet: { status: 'connected', address: key ? key.toString() : '', msg: 'Wallet connected. Aura only reads your address; nothing is signed.' } }); }
catch (e) { this.setState({ wallet: { status: 'idle', address: '', msg: 'Connection was cancelled.' } }); }
}
renderVals() {
const pools = [
{ pair: 'YZY-USDC', addr: 'DQ9we…buMcf', liquidity: '$37,613,217', volume: '$195,415', fees: '$1,769', bin: '100' },
{ pair: 'ANTFUN-USDT', addr: '54Vp2…s4EUJ', liquidity: '$15,114,816', volume: '$1,333,208', fees: '$411', bin: '16' },
{ pair: 'MELANIA-USDC', addr: '9Diru…Fz2ad', liquidity: '$12,831,873', volume: '$7,391', fees: '$89', bin: '100' },
{ pair: 'TRUMP-USDC', addr: '3C5YE…nDbW9', liquidity: '$11,792,460', volume: '$1,375,493', fees: '$1,243', bin: '10' },
{ pair: 'TRUMP-USDC', addr: '9d9mb…ixyy2', liquidity: '$11,327,394', volume: '$240,968', fees: '$220', bin: '50' },
{ pair: 'arc-USDC', addr: 'DW2QC…RW6i9', liquidity: '$10,499,648', volume: '$4,899', fees: '$9', bin: '20' },
{ pair: 'SOL-USDC', addr: '5rCf1…YHAS6', liquidity: '$7,324,249', volume: '$15,804,789', fees: '$5,837', bin: '4' },
{ pair: 'BP-USDC', addr: '6qz7T…iwfjd', liquidity: '$6,076,828', volume: '$4,818,516', fees: '$12,263', bin: '50' },
{ pair: 'FO-USDT', addr: 'AXXo7…SKtM3', liquidity: '$4,664,346', volume: '$5,509', fees: '$10', bin: '100' },
{ pair: 'PENGU-USDC', addr: 'DdMA1…mdvzU', liquidity: '$4,411,703', volume: '$1,519,052', fees: '$3,430', bin: '25' },
{ pair: 'MU-USDC', addr: '13MEx…5nYF5', liquidity: '$4,387,735', volume: '$33,342', fees: '$61', bin: '20' },
{ pair: 'JupUSD-USDC', addr: 'DZ2vZ…a2mPP', liquidity: '$3,868,429', volume: '$14,969', fees: '$1', bin: '1' },
{ pair: 'cbBTC-SOL', addr: 'H2USR…yecKw', liquidity: '$900,062', volume: '$385,063', fees: '$524', bin: '15' },
{ pair: 'SI-SOL', addr: '8uwFM…2NtHk', liquidity: '$806,062', volume: '$4,409,373', fees: '$17,311', bin: '30' },
{ pair: 'SOL-USDC', addr: 'CgqwP…kXaqY', liquidity: '$796,001', volume: '$177,540', fees: '$82', bin: '80' },
{ pair: 'SPCX-USDC', addr: '7nVQt…qgTWu', liquidity: '$761,958', volume: '$110,127', fees: '$743', bin: '75' },
{ pair: 'Agency-SOL', addr: 'GDoen…vBiuW', liquidity: '$721,699', volume: '$4,329,744', fees: '$101,876', bin: '100' },
{ pair: 'tKalshi-USDC', addr: 'CGYxc…Fsuff', liquidity: '$701,340', volume: '$154,785', fees: '$12', bin: '80' }
];
const q = this.state.query.trim().toLowerCase();
const rows = pools
.filter((p) => { if (this.state.quote === 'all') return true; const f = this.state.quote.toLowerCase(); return p.pair.toLowerCase().split('-').some((t) => t === f || t.startsWith(f)); })
.filter((p) => !q || p.pair.toLowerCase().includes(q) || p.addr.toLowerCase().includes(q))
.map((p) => ({ ...p, initial: p.pair.slice(0, 1).toUpperCase() }));
return {
accent: this.props.accent ?? '#12AEBC',
rows,
empty: rows.length === 0,
query: this.state.query,
clock: this.state.clock,
onQuery: (e) => this.setState({ query: e.target.value }),
onQuote: (e) => this.setState({ quote: e.target.value }),
contractLabel: this.state.copied ? 'Copied' : 'Contract',
walletLabel: this.state.wallet.status === 'connected' ? (this.state.wallet.address.slice(0, 4) + '…' + this.state.wallet.address.slice(-4)) : (this.state.wallet.status === 'connecting' ? 'Connecting…' : 'Connect wallet'),
walletAction: () => this.walletToggle(),
walletHasMsg: !!this.state.wallet.msg,
walletMsg: this.state.wallet.msg,
dismissWallet: () => this.setState({ wallet: Object.assign({}, this.state.wallet, { msg: '' }) }),
copyContract: () => {
try { navigator.clipboard.writeText('AuraL54hWmsKiEY31Sy6hPDYhegdzA3vCKh2uTwCpLZG'); } catch (e) {}
this.setState({ copied: true });
setTimeout(() => this.setState({ copied: false }), 1600);
}
};
}
}

render(h(Component, {"accent": "#12AEBC"}), document.getElementById('app'));
</script>
</body>
</html>
