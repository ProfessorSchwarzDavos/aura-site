<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuraOnchain — Feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
@keyframes auraShine{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.08) rotate(12deg)}}
@media (prefers-reduced-motion: reduce){.aura-logo svg{animation:none !important}}
a{color:#08707C}a:hover{color:#05505A}
</style>
</helmet>
<div style="background: #F6F4EF; color: #1C1B22; font-family: 'Manrope', 'Helvetica Neue', sans-serif; min-height: 100vh">

<header style="max-width: 1240px; margin: 0 auto; padding: 24px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1C1B22">
<span class="aura-logo" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 8px rgba(18,174,188,0.55))"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true" style="display: block; animation: auraShine 5s ease-in-out infinite"><defs><linearGradient id="auraLogoGradFeed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.45" stop-color="#C9F3F7"></stop><stop offset="1" stop-color="#4FC3D6"></stop></linearGradient></defs><path d="M12 0C12.6 7.2 16.8 11.4 24 12C16.8 12.6 12.6 16.8 12 24C11.4 16.8 7.2 12.6 0 12C7.2 11.4 11.4 7.2 12 0Z" fill="url(#auraLogoGradFeed)" stroke="#12AEBC" stroke-width="0.6"></path><path d="M12 7.5C12.25 10.4 13.6 11.75 16.5 12C13.6 12.25 12.25 13.6 12 16.5C11.75 13.6 10.4 12.25 7.5 12C10.4 11.75 11.75 10.4 12 7.5Z" fill="#FFFFFF"></path></svg></span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1; letter-spacing: 0.01em">Aura</span>
</a>
<a href="Main.dc.html" style="font-family: 'Space Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #55535E; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">← Back home</a>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 48px 32px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 32px">
<div style="width: 128px; height: 128px; border-radius: 50%; border: 2px solid {{accent}}; padding: 6px; box-sizing: border-box; flex: 0 0 auto">
<div style="width: 100%; height: 100%; border-radius: 50%; background: #E3F3F2; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; color: #6B6975">[AVATAR]</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: clamp(44px, 5vw, 64px)">Aura</h1>
<div style="font-family: 'Space Mono', monospace; font-size: 14px; color: #08707C">@Auraonchainai</div>
<p style="margin: 0; max-width: 620px; font-size: 17px; line-height: 1.6; color: #55535E">Liquidity agent on Meteora. Your rules, every move previewed, every decision explained. [EDIT BIO]</p>
<div style="display: flex; flex-wrap: wrap; gap: 24px; font-family: 'Space Mono', monospace; font-size: 13px; color: #6B6975">
<span><strong style="color: #1C1B22">[0]</strong> posts</span>
<span><strong style="color: #1C1B22">[0]</strong> followers</span>
<span>Joined [MONTH YEAR]</span>
</div>
</div>
<a href="https://x.com/Auraonchainai" style="text-decoration: none; color: #062A29; background: {{accent}}; font-weight: 700; font-size: 15px; padding: 14px 24px; border-radius: 999px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center">Follow on X</a>
</section>

<nav aria-label="Feed filters" style="max-width: 1240px; margin: 0 auto; padding: 0 32px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #E2DED5">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<button type="button" onClick="{{tab.pick}}" style="background: transparent; border: none; border-bottom: {{tab.border}}; color: {{tab.color}}; font-family: 'Space Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 18px; min-height: 48px; cursor: pointer">{{tab.label}}</button>
</sc-for>
</nav>

<section style="max-width: 1240px; margin: 0 auto; padding: 40px 32px 120px">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px">
<sc-for list="{{posts}}" as="post" hint-placeholder-count="6">
<article style="background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<sc-if value="{{post.hasMedia}}" hint-placeholder-val="{{ true }}">
<div style="aspect-ratio: 16 / 10; background: #E3F3F2; border-bottom: 1px solid #E2DED5; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Space Mono', monospace; font-size: 12px; color: #6B6975; letter-spacing: 0.08em">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>
<span>{{post.mediaLabel}}</span>
</div>
</sc-if>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 14px; flex: 1">
<div style="display: flex; justify-content: space-between; gap: 12px; font-family: 'Space Mono', monospace; font-size: 12px; color: #6B6975">
<span style="color: #08707C">{{post.kind}}</span><span>{{post.date}}</span>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3A3842">{{post.text}}</p>
<div style="margin-top: auto; display: flex; gap: 20px; font-family: 'Space Mono', monospace; font-size: 12px; color: #6B6975">
<span>♥ [0]</span><span>↻ [0]</span>
<a href="https://x.com/Auraonchainai" style="margin-left: auto; color: #08707C; text-decoration: none">View on X →</a>
</div>
</div>
</article>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#12AEBC","options":["#12AEBC","#0ABAB5","#4FC3D6","#0B8FA0"]},"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'all' };
}
renderVals() {
const accent = this.props.accent ?? '#12AEBC';
const tabDefs = [
{ id: 'all', label: 'All' },
{ id: 'post', label: 'Posts' },
{ id: 'image', label: 'Images' },
{ id: 'video', label: 'Videos' }
];
const tabs = tabDefs.map((t) => {
const on = this.state.tab === t.id;
return {
label: t.label,
color: on ? '#1C1B22' : '#6B6975',
border: on ? '2px solid ' + accent : '2px solid transparent',
pick: () => this.setState({ tab: t.id })
};
});
const all = [
{ type: 'image', kind: 'IMAGE', date: '[DATE]', hasMedia: true, mediaLabel: 'DROP YOUR IMAGE HERE', text: 'Launch announcement — your first post goes here. [EDIT]' },
{ type: 'post', kind: 'POST', date: '[DATE]', hasMedia: false, mediaLabel: '', text: 'Set the rules once. Watch every move before it happens. [EDIT]' },
{ type: 'video', kind: 'VIDEO', date: '[DATE]', hasMedia: true, mediaLabel: 'DROP YOUR VIDEO HERE', text: 'Teaser trailer caption. [EDIT]' },
{ type: 'post', kind: 'POST', date: '[DATE]', hasMedia: false, mediaLabel: '', text: 'Phase I is live: build your rules and preview moves on Meteora. [EDIT]' },
{ type: 'image', kind: 'IMAGE', date: '[DATE]', hasMedia: true, mediaLabel: 'DROP YOUR IMAGE HERE', text: 'Screenshot of a move preview with its reasoning. [EDIT]' },
{ type: 'image', kind: 'IMAGE', date: '[DATE]', hasMedia: true, mediaLabel: 'DROP YOUR IMAGE HERE', text: 'Community spotlight. [EDIT]' }
];
const posts = this.state.tab === 'all' ? all : all.filter((p) => p.type === this.state.tab);
return { accent, tabs, posts };
}
}
</script>
</body>
</html>
