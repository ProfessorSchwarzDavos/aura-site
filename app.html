<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;background:#F6F4EF}
a{color:#08707C}a:hover{color:#05505A}
@keyframes auraShine{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.08) rotate(12deg)}}
@keyframes auraGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,255,255,.95)) drop-shadow(0 0 30px rgba(255,255,255,.55))}50%{filter:drop-shadow(0 0 16px #FFFFFF) drop-shadow(0 0 56px rgba(255,255,255,.85)) drop-shadow(0 0 96px rgba(190,244,250,.6))}}
@keyframes auraTwinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@keyframes auraFloat{0%,100%{translate:0 0}25%{translate:8px -12px}50%{translate:-4px -22px}75%{translate:-10px -8px}}
@keyframes auraSpin{to{rotate:360deg}}
@keyframes auraPulse{0%,100%{opacity:.55;scale:1}50%{opacity:1;scale:1.06}}
@keyframes auraPing{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
@media (prefers-reduced-motion: reduce){.aura-star,.aura-star svg,.aura-logo,.aura-logo svg,.aura-motion{animation:none !important}}
.aura-btn{transition:transform .25s ease, box-shadow .25s ease}
.aura-btn:hover{transform:translateY(-1px)}
.aura-nav:hover{background:#F1F8F9 !important}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #12AEBC;outline-offset:2px}
summary::-webkit-details-marker{display:none}
</style>
<style>html{scroll-behavior:smooth}#app{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>

// Small base class: each page's logic exposes renderVals(), the template reads from it.

  render() { const v = this.renderVals(); return TEMPLATE(v); }
}

</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 3 1 460px; min-width: 0; background: #E3F6F8; border: 1px solid #CDEBEF; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 18px">

const setP = {};
['pair', 'pool', 'amount', 'allocated', 'inPool', 'liquidity', 'slippage'].forEach((k) => {
setP[k] = (e) => this.setState({ prop: Object.assign({}, this.state.prop, { [k]: e.target.value }) });
});
const pairsTxt = r.pairs.split(',').map((x) => this.normPair(x)).filter(Boolean).join(', ') || 'no pairs yet';
const summaryShort = 'Allow ' + pairsTxt + ' \u00b7 up to ' + this.money(r.budget) + ' total \u00b7 ' + this.money(r.perMove) + ' per move.';
const summaryLong = '\u201cAura may provide ' + r.shape + ' liquidity on ' + pairsTxt + ', using no more than ' + this.money(r.budget) + ' in total. No single move above ' + this.money(r.perMove) + ', no pool thinner than ' + this.money(r.minLiq) + ', and slippage kept under ' + r.slippage + '%.' + (r.signoff ? ' Nothing is approved without me.' : '') + '\u201d';
const presets = Object.keys(this.presets).map((k) => {
const on = s.preset === k;
return { label: this.presets[k].label, pressed: on ? 'true' : 'false', bg: on ? accent : '#FFFFFF', fg: '#04282E', pick: () => this.setState({ rules: Object.assign({}, this.presets[k]), preset: k }) };
});
const shapeTabs = ['Spot', 'Curve', 'Bid-Ask'].map((sh) => ({ label: sh, pressed: r.shape === sh ? 'true' : 'false', bg: r.shape === sh ? accent : 'transparent', pick: () => this.setState({ rules: Object.assign({}, this.state.rules, { shape: sh }) }) }));
const firstPair = r.pairs.split(',')[0] ? this.normPair(r.pairs.split(',')[0]) : 'SOL/USDC';
const per = this.num(r.perMove), minLiq = this.num(r.minLiq), maxSlip = this.num(r.slippage);
const base = { pair: firstPair, pool: '', amount: String(Math.max(1, Math.round(per * 0.6))), allocated: '0', inPool: '0', liquidity: String(Math.max(minLiq * 2, 250000)), slippage: String(Math.max(0.1, +(maxSlip * 0.4).toFixed(2))) };
const scenarios = [
{ label: 'Fits my rules', p: base },
{ label: 'Too big', p: Object.assign({}, base, { amount: String(Math.round(per * 1.6)) }) },
{ label: 'Pool too shallow', p: Object.assign({}, base, { liquidity: String(Math.round(minLiq / 4)) }) },
{ label: 'Slippage too high', p: Object.assign({}, base, { slippage: String(+(maxSlip * 3).toFixed(2)) }) }
].map((x) => ({ label: x.label, pick: () => this.setState({ prop: Object.assign({}, x.p), result: null }) }));
const decorate = (e) => { const c = this.status(e.status); return Object.assign({}, e, { bg: c.bg, fg: c.fg, amountLabel: this.money(e.amount), checks: (e.checks || []).map((k) => Object.assign({}, k, { bad: !k.ok })) }); };
const filters = [['all', 'All'], ['Held', 'Held'], ['Approved', 'Approved'], ['Waiting on you', 'Waiting'], ['Fits', 'Fits'], ['Declined', 'Declined']];
const logTabs = filters.map(([k, label]) => ({ label, pressed: s.logFilter === k ? 'true' : 'false', bg: s.logFilter === k ? accent : 'transparent', pick: () => this.setState({ logFilter: k }) }));
const filteredLog = s.log.filter((e) => s.logFilter === 'all' || e.status === s.logFilter).map(decorate);
const count = (st) => s.log.filter((e) => e.status === st).length;
const passed = s.log.filter((e) => e.status !== 'Held').length;
const passRate = s.log.length ? Math.round((passed / s.log.length) * 100) : 0;
const w = s.wallet;
const walletLabel = w.status === 'connected' ? this.short(w.address) : (w.status === 'connecting' ? 'Connecting\u2026' : 'Connect wallet');
return {
accent, nav, set, setP,
is: { overview: s.screen === 'overview', rules: s.screen === 'rules', preview: s.screen === 'preview', log: s.screen === 'log' },
screenTitle: titles[s.screen],
rules: r, prop: s.prop,
savedLabel: s.saved ? 'Saved' : 'Not saved yet',
saveNote: s.saved ? 'Saved in this browser' + (s.savedAt ? ' on ' + s.savedAt : '') + '. A preview rule set, not on-chain enforcement.' : 'Saved in this browser only. A preview rule set, not on-chain enforcement.',
summaryShort, summaryLong,
chips: [r.shape, 'Slippage \u2264 ' + r.slippage + '%', r.signoff ? 'Ask me first' : 'Auto when it fits'],
stats: [
{ label: 'BUDGET', value: this.money(r.budget) },
{ label: 'PREVIEWS RUN', value: String(s.log.length) },
{ label: 'APPROVED', value: String(count('Approved')) },
{ label: 'HELD', value: String(count('Held')) }
],
logStats: [
{ label: 'ALL', value: String(s.log.length), color: '#04282E' },
{ label: 'APPROVED', value: String(count('Approved')), color: '#08707C' },
{ label: 'HELD', value: String(count('Held')), color: '#8A2A16' },
{ label: 'WAITING', value: String(count('Waiting on you')), color: '#7A4E00' }
],
passRate,
recent: s.log.slice(0, 3).map(decorate),
logEmpty: s.log.length === 0,
filteredLog, logTabs,
presets, shapeTabs, scenarios,
bars: this.bars(r.shape, r.range),
toggleSignoff: () => this.setState({ rules: Object.assign({}, this.state.rules, { signoff: !this.state.rules.signoff }) }),
saveRules: () => { const at = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); try { localStorage.setItem('aura-rules', JSON.stringify({ rules: this.state.rules, savedAt: at })); } catch (e) {} this.setState({ saved: true, savedAt: at }); },
resetRules: () => { try { localStorage.removeItem('aura-rules'); } catch (e) {} this.setState({ rules: Object.assign({}, this.presets.steady), preset: 'steady', saved: false, savedAt: '' }); },
copyRulesLabel: s.copiedRules ? 'Copied' : 'Copy as JSON',
copyRules: () => { try { navigator.clipboard.writeText(JSON.stringify(this.state.rules, null, 2)); } catch (e) {} this.setState({ copiedRules: true }); setTimeout(() => this.setState({ copiedRules: false }), 1600); },
copyLogLabel: s.copiedLog ? 'Copied' : 'Copy as JSON',
copyLog: () => { try { navigator.clipboard.writeText(JSON.stringify(this.state.log, null, 2)); } catch (e) {} this.setState({ copiedLog: true }); setTimeout(() => this.setState({ copiedLog: false }), 1600); },
clearLog: () => { this.persistLog([]); this.setState({ log: [], result: null }); },
pausedBadge: s.paused ? 'Previews paused' : 'Preview mode',
pauseLabel: s.paused ? 'Resume previews' : 'Pause previews',
togglePause: () => this.setState({ paused: !this.state.paused }),
bannerText: s.saved ? 'Checking against your saved rule set \u201c' + r.name + '\u201d.' : 'Using an unsaved example rule set. Save your own on My rules.',
quickText: s.quickText, quickMsg: s.quickMsg,
setQuick: (e) => this.setState({ quickText: e.target.value }),
runQuick: () => this.quickFill(),
evaluate: () => this.evaluate(),
approve: () => this.decide('Approved'),
decline: () => this.decide('Declined'),
noResult: !s.result, hasResult: !!s.result,
result: s.result || { verdict: '', bg: '#FFFFFF', fg: '#04282E', checks: [], awaiting: false },
checkNames: [
{ label: 'PAIR', value: pairsTxt },
{ label: 'POOL', value: r.pools.trim() ? r.pools.trim().split(/\s+/).length + ' allowed' : 'Any pool for your pairs' },
{ label: 'LARGEST MOVE', value: 'Up to ' + this.money(r.perMove) },
{ label: 'TOTAL BUDGET', value: this.money(r.budget) },
{ label: 'POOL SHARE', value: 'Max ' + r.exposure + '% of budget' },
{ label: 'POOL DEPTH', value: 'At least ' + this.money(r.minLiq) },
{ label: 'SLIPPAGE', value: 'Under ' + r.slippage + '%' }
],
wallet: { label: walletLabel, connected: w.status === 'connected', notConnected: w.status !== 'connected', msg: w.msg, hasMsg: !!w.msg },
walletAction: () => (this.state.wallet.status === 'connected' ? this.disconnectWallet() : this.connectWallet()),
dismissWallet: () => this.setState({ wallet: Object.assign({}, this.state.wallet, { msg: '' }) }),
contractLabel: s.copied ? 'Copied' : 'Contract',
copyContract: () => { try { navigator.clipboard.writeText('AuraL54hWmsKiEY31Sy6hPDYhegdzA3vCKh2uTwCpLZG'); } catch (e) {} this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1600); }
};
}
}

render(h(Component, {"accent": "#12AEBC", "startScreen": "overview"}), document.getElementById('app'));
</script>
</body>
